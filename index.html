<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguimiento de actividades</title>
    <script>
      // Antes de pintar: tema guardado o el del sistema, para no mostrar un destello claro
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tema') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (localStorage.getItem('idioma') === 'en') document.documentElement.lang = 'en'
      } catch { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
