# Blueprint de Render: un solo servicio que expone la API de Fastify y sirve el frontend compilado
services:
  - type: web
    name: seguimiento-de-actividades
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Render espera a que responda antes de mandarle tráfico (y revisa que la base conteste)
    healthCheckPath: /api/salud
