# NGINX 1.26 (Rocky Linux 10): atiende HTTPS hacia la red y reenvía todo a la app, que escucha solo en 127.0.0.1:3000.
# La app ya sirve sus archivos comprimidos y con caché; NGINX no necesita más.
# Copiar a /etc/nginx/conf.d/seguimiento.conf y cambiar server_name y las rutas del certificado.
# Solo IPv4 (la red de planta). Con IPv6 activo se puede agregar  listen [::]:80;  y  listen [::]:443 ssl;

server {
    listen 80;
    server_name actividades.planta.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name actividades.planta.local;

    ssl_certificate     /etc/pki/tls/certs/seguimiento.crt;    # certificado + cadena intermedia, en ese orden
    ssl_certificate_key /etc/pki/tls/private/seguimiento.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # La app acepta hasta 1 MB por petición (fotos de perfil, plantillas)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real para Registros: $remote_addr REEMPLAZA lo que mande el navegador, así nadie falsea su IP
        proxy_set_header X-Forwarded-For $remote_addr;
        # La app sabe que llegó por HTTPS y marca la cookie de sesión como Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
